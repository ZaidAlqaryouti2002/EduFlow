<header class="topbar">
    <div class="topbar-left">
        <button
            class="menu-toggle"
            type="button"
        >
            <span class="material-symbols-rounded"> menu </span>
        </button>
        <div class="search">
            <span class="material-symbols-rounded"> search </span>

            <input
                type="search"
                placeholder="Search courses..."
            />
        </div>
    </div>

    <div class="top-actions">
        <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to dark mode"
        >
            <span class="material-symbols-rounded icon-moon"> dark_mode </span>
            <span class="material-symbols-rounded icon-sun"> light_mode </span>
        </button>
        <div class="dropdown-menu">
            <div class="user dropdown-menu-trigger">
                <span class="avatar">AM</span>
                <span class="user-name">Loading...</span>
                <span class="material-symbols-rounded icon"> keyboard_arrow_down </span>
            </div>
            <div class="dropdown-menu-body">
                <ul>
                    <li class="dropdown-menu-item">
                        <a href="/pages/profile.html"> Profile </a>
                    </li>
                    <li class="dropdown-menu-item logout-button">
                        <a href=""> Logout </a>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
