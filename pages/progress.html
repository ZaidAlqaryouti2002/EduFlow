<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>EduTrack - Progress</title>
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        />
        <link
            rel="stylesheet"
            href="../style/layout.css"
        />
        <link
            rel="stylesheet"
            href="../style/progress.css"
        />

        <script src="https://unpkg.com/@jsblocks/theme@1/dist/theme.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <script src="../js/api.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/layout.js"></script>
    </head>
    <body data-page="progress">
        <div id="sidebar-container"></div>

        <div class="main">
            <div id="topbar-container"></div>

            <main class="content">
                <div class="page-header">
                    <h1>Progress</h1>
                </div>

                <div class="table-card">
                    <table class="progress-table">
                        <!-- يمكن أيضاً جعل الـ thead ديناميكياً إذا كانت الكويزات متغيرة، لكن تركته حسب التصميم لتوضيح الهيكل -->
                        <thead id="progress-table-head">
                            <tr>
                                <th>Student</th>
                                <th>Quiz 1 /10</th>
                                <th>Homework 1 /20</th>
                                <th>Midterm exam /100</th>
                                <th>Math /9</th>
                                <th>Final</th>
                            </tr>
                        </thead>
                        <tbody id="progress-table-body">
                            <!-- سيتم حقن صفوف الطلاب والعلامات هنا بواسطة الجافاسكريبت -->
                        </tbody>
                    </table>
                </div>

                <div class="page-actions">
                    <button
                        type="button"
                        class="btn-primary"
                        id="save-progress-btn"
                    >
                        Save Changes
                    </button>
                </div>
            </main>
        </div>

        <script
            src="../js/grades.js"
            defer
        ></script>

        <script
            src="../js/progress.js"
            defer
        ></script>
    </body>
</html>
