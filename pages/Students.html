<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow</title>
   
    <link rel="icon" href="../assets/logo.svg" type="image/x-icon">
    <link rel="stylesheet" href="../style/layout.css">
     <link rel="stylesheet" href="../style/Students.css">

        <script src="../js/api.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/layout.js"></script>
     
</head>
<body>
     <!-- Sidebar -->
    <div id="sidebar-container"></div>

    <!-- Topbar -->
    <div id="topbar-container"></div>
    
     <main class="main-content"> 
    <section class="impInfo">
        <div class="impInfoCard"><h1 id="activeStudentsCount">0</h1>
        <span>Active Students</span>
    </div>
        <div class="impInfoCard"><h1  id="classAverage">0</h1>
        <span>Class average</span>
    </div>
        <div class="impInfoCard"><h1 id="attendanceAverage">0%</h1>
        <span>Avg.attendence</span>
    </div>
        <div class="impInfoCard"><h1 id="monitoringCount">0</h1>
        <span>Need attention</span>
    </div>
    </section>
    <section class="students"> 
        <input type="search" id="searchInput" placeholder="Search by Name or ID">
        <select id="courseFilter">
             <option value="all">All Courses</option>
        </select>
       <select id="statusFilter">
    <option value="active">Active</option>
    <option value="archived">Archived</option>
</select>
        <button class="export" id="export">Export</button>
        <button class="addStudentsBtn" id="addStudentsBtn">Add Student</button>
    </section>
 <section class="studentsTable">
    <table border="1">
        <thead>
             <tr> <th>Student Name</th>
                <th>Student ID</th>
                <th>Attendance</th>
                <th>Grade</th> 
                <th>Status</th>
                <th>Actions</th>
                </tr> 
        </thead>
        <!-- /*we will show all students here using js code*/ -->
        <tbody id="studentsContainer">  </tbody>
    </table>
 </section>
 <div id="toast" class="toast">
    <span id="toastMessage"></span>
</div>
 
 <script src="../js/Students.js"></script>

 </main>
 
</body>
</html>
