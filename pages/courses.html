<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFlow - Courses</title>
    <link rel="stylesheet" href="/style/layout.css">
    <link rel="stylesheet" href="/style/courses.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="/js/layout.js"></script>
</head>
<body data-page="courses">

    <div id="sidebar-container"></div>

    <div id="topbar-container"></div>

    <div class="main">
        <main class="content">
            <div class="page-header">
                <div>
                    <h1>My Courses</h1>
                    <p>Explore your active courses, progress, and assignments.</p>
                </div>
                <button class="btn-primary" id="add-course-btn">
                    <i data-lucide="plus"></i> Add Course
                </button>
            </div>

            <div class="courses-grid" id="courses-container"></div>
        </main>
    </div>

    <div id="add-course-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add New Course</h2>
                <button id="close-modal-btn" class="close-btn"><i data-lucide="x"></i></button>
            </div>
            <form id="add-course-form">
                <div class="form-group">
                    <label for="course-name">Course Name</label>
                    <input type="text" id="course-name" placeholder="e.g. Database Systems" required>
                    <p id="course-error" class="form-error hidden"></p>
                </div>
                <div class="form-group">
                    <label for="course-code">Course Code</label>
                    <input type="text" id="course-code" placeholder="e.g. CS 301" required>
                </div>
                <div class="modal-actions">
                    <button type="button" id="cancel-modal-btn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Add Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/courses.js"></script>
</body>
</html>
