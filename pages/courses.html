<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>EduFlow - Courses</title>

        <link
            rel="stylesheet"
            href="../style/layout.css"
        />
        <link
            rel="stylesheet"
            href="../style/courses.css"
        />

        <link
            rel="shortcut icon"
            href="../assets/logo.svg"
            type="image/x-icon"
        />
        
        <!-- Loading theme and icons in head to prevent FOUC (Flash of Unstyled Content) on initial paint -->
        <script src="https://unpkg.com/@jsblocks/theme@1/dist/theme.min.js"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
    </head>
    
    <!-- layout.js hooks into data-page to highlight the active sidebar item -->
    <body data-page="courses">
        
        <!-- Hydrated by layout.js on DOMContentLoaded. Kept empty to avoid layout shift -->
        <div id="sidebar-container"></div>
        <div id="topbar-container"></div>

        <div class="main">
            <main class="content">
                <div class="page-header">
                    <div>
                        <h1>My Courses</h1>
                        <p>Explore your active courses, progress, and assignments.</p>
                    </div>
                    <button
                        class="btn-primary"
                        id="add-course-btn"
                    >
                        <i data-lucide="plus"></i> Add Course
                    </button>
                </div>

                <div
                    class="courses-grid"
                    id="courses-container"
                ></div>
            </main>
        </div>

        <!-- TODO: Add proper focus-trapping and aria attributes for a11y. Fine for now, but needs fixing before beta -->
        <div
            id="add-course-modal"
            class="modal-overlay hidden"
        >
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Add New Course</h2>
                    <button
                        id="close-modal-btn"
                        class="close-btn"
                    >
                        <i data-lucide="x"></i>
                    </button>
                </div>
                <form id="add-course-form">
                    <div class="form-group">
                        <label for="course-name">Course Name</label>
                        <input
                            type="text"
                            id="course-name"
                            placeholder="e.g. Database Systems"
                            required
                        />
                        <!-- Client-side error state container. API 400s will unhide and populate this -->
                        <p
                            id="course-error"
                            class="form-error hidden"
                        ></p>
                    </div>
                    <div class="form-group">
                        <label for="course-code">Course Code</label>
                        <input
                            type="text"
                            id="course-code"
                            placeholder="e.g. CS 301"
                            required
                        />
                    </div>
                    <div class="modal-actions">
                        <button
                            type="button"
                            id="cancel-modal-btn"
                            class="btn-secondary"
                        >
                            Cancel
                        </button>
                        <button
                            type="submit"
                            class="btn-primary"
                        >
                            Add Course
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Strict dependency chain. Don't reorder these or courses.js will crash looking for auth/api singletons -->
        <script src="../js/api.js"></script>
        <script src="../js/auth.js"></script>
        <script src="../js/layout.js"></script>
        <script src="../js/courses.js"></script>
    </body>
</html>
